{% extends 'base.html' %}
{% block title %}Login · PaperAtlas{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  <p><a href="{% url 'accounts:register' %}">Create an account</a></p>
</section>
{% endblock %}
